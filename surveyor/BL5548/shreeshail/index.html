      if(Number.isFinite(m.lat)&&Number.isFinite(m.lon)){
        const dot=L.circleMarker([m.lat,m.lon],{radius:5,color:'#ffffff',weight:1.5,fillColor:color,fillOpacity:1}).addTo(marketLayer);
        dot.bindPopup('<b>'+safe(m.name)+'</b><br>Visit order: '+fmt(m.visit)+'<br>Market ID: '+safe(m.id));
        L.tooltip({permanent:true,direction:'top',offset:[0,-5],className:'market-label'}).setLatLng([m.lat,m.lon]).setContent(safe(m.name)).addTo(labelLayer);
        allBounds.push([m.lat,m.lon]);
      }
      const b=lyr.getBounds();if(b.isValid())allBounds.push(b.getSouthWest(),b.getNorthEast());
    });
    if(allBounds.length)map.fitBounds(L.latLngBounds(allBounds).pad(.10));
  }
  function startGPS(){
    if(!navigator.geolocation){setStatus('Location not supported','This browser does not expose GPS location.','#dc2626');return;}
    if(watchId!==null)return;
    watchId=navigator.geolocation.watchPosition(p=>{
      position={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:Number(p.coords.accuracy)||0};
      gpsLayer.clearLayers();
      L.circle([position.lat,position.lon],{radius:Math.max(5,position.accuracy),color:'#38bdf8',weight:1,fillColor:'#38bdf8',fillOpacity:.13,interactive:false}).addTo(gpsLayer);
      L.circleMarker([position.lat,position.lon],{radius:10,color:'#ffffff',weight:3,fillColor:'#0ea5e9',fillOpacity:1,interactive:false}).addTo(gpsLayer);
      if(firstFix){map.setView([position.lat,position.lon],Math.max(map.getZoom(),16));firstFix=false;}
      updateCurrent();
    },e=>{
      const msg=e.code===1?'Location permission denied. Allow location for this GitHub Pages site in browser settings.':
        e.code===2?'GPS position unavailable. Check device location services.':'Waiting for GPS fix. Keep the page open and location enabled.';
      setStatus('Location unavailable',msg,'#dc2626');
    },{enableHighAccuracy:true,maximumAge:3000,timeout:30000});
  }
  $('centreMe').addEventListener('click',()=>{if(position)map.setView([position.lat,position.lon],Math.max(map.getZoom(),16));else startGPS();});
  $('centreMarkets').addEventListener('click',()=>{if(allBounds.length)map.fitBounds(L.latLngBounds(allBounds).pad(.10));});
  renderMarkets();
  if(location.protocol==='file:')setStatus('Open the HTTPS GitHub link','GPS is blocked when this page is opened as a local file.','#dc2626');
  else{setStatus('Finding your location…',D.wd+' · '+D.surveyor+' · '+D.markets.length+' assigned markets',color);startGPS();}
  window.addEventListener('pagehide',()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);});
})();
</script>
